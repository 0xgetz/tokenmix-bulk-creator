<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="TokenMix Bulk Account Creator banner">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.5" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#141c3d"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#39d0ff"/>
      <stop offset="1" stop-color="#22e6a5"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd0ff"/>
    </linearGradient>
    <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bgb)"/>
  <g opacity="0.10" stroke="#4f86ff" stroke-width="1">
    <path d="M0 70 H1280 M0 140 H1280 M0 210 H1280 M0 280 H1280 M0 350 H1280"/>
    <path d="M120 0 V420 M260 0 V420 M400 0 V420 M540 0 V420 M680 0 V420 M820 0 V420 M960 0 V420 M1100 0 V420"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(90 90) scale(0.32)">
    <rect width="640" height="640" rx="140" fill="#0e1530"/>
    <g opacity="0.9">
      <rect x="150" y="300" width="340" height="120" rx="26" fill="#20305e" stroke="#3e6bd6" stroke-width="3"/>
      <rect x="150" y="350" width="340" height="130" rx="26" fill="#27407f" stroke="#4f86ff" stroke-width="3"/>
    </g>
    <circle cx="320" cy="250" r="52" fill="none" stroke="url(#acc)" stroke-width="12"/>
    <circle cx="320" cy="250" r="18" fill="url(#acc)"/>
    <path d="M418 300 L372 384 L404 384 L378 452 L452 356 L416 356 Z" fill="url(#acc)" filter="url(#g2)"/>
  </g>

  <text x="360" y="185" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="800" fill="url(#txt)">TokenMix Bulk Creator</text>
  <text x="362" y="245" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#8fb4e8">Bulk accounts · disposable inboxes · auto API keys</text>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="362" y="290" rx="20" width="220" height="46" fill="#1b2444" stroke="#3e6bd6" stroke-width="2"/>
    <text x="392" y="320" fill="#bcd7ff">mail.tm inbox</text>
    <rect x="600" y="290" rx="20" width="230" height="46" fill="#1b2444" stroke="#3e6bd6" stroke-width="2"/>
    <text x="630" y="320" fill="#bcd7ff">Turnstile aware</text>
    <rect x="848" y="290" rx="20" width="240" height="46" fill="#1b2444" stroke="#3e6bd6" stroke-width="2"/>
    <text x="878" y="320" fill="#bcd7ff">random key names</text>
  </g>
</svg>
