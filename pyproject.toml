[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmix-bulk-creator"
version = "1.1.0"
description = "Bulk-provision TokenMix accounts with disposable inboxes and auto-generate API keys with random names."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TokenMix Bulk Creator Contributors" }]
keywords = [
    "tokenmix", "bulk-registration", "automation", "playwright",
    "api-keys", "temp-mail-io", "mail-tm", "open-source", "llm-gateway",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "playwright>=1.40",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/0xgetz/tokenmix-bulk-creator"
Repository = "https://github.com/0xgetz/tokenmix-bulk-creator"
Issues = "https://github.com/0xgetz/tokenmix-bulk-creator/issues"

[project.scripts]
tokenmix-bulk = "tokenmix_bulk.cli:main"

[tool.setuptools]
packages = ["tokenmix_bulk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
